name: Usage / integration report
description: Share a real deployment, integration, compatibility result, or reproducible usage case.
title: "[Usage]: "
body:
  - type: markdown
    attributes:
      value: |
        Real usage reports help maintainers understand compatibility and turn confirmed cases into regression tests. Please do not include private or sensitive divination content.
  - type: dropdown
    id: mode
    attributes:
      label: How are you using the project?
      options:
        - Local Python application
        - Docker / container deployment
        - REST API integration
        - Browser UI
        - Research / rule verification
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: v0.x.y or commit SHA
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python/container version, deployment method, and relevant client details.
    validations:
      required: true
  - type: textarea
    id: use_case
    attributes:
      label: Use case and result
      description: What did you integrate or verify? What worked, failed, or needs clarification?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproducible input or example
      description: Provide a minimal non-sensitive request, API payload, or sequence if applicable.
