name: One-time v0.2.0 Publish

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-v020-once.yml"

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  publish:
    if: github.event.head_commit.message == 'publish-v0.2.0'
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: v0.2.0
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: v0.2.0

      - name: Set image repository
        shell: bash
        run: echo "IMAGE_REPO=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/liuyao-paipan" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml

      - name: Test release candidate
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e . --no-deps
          python -m pytest -q

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push container
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          sbom: true
          provenance: mode=max
          tags: |
            ${{ env.IMAGE_REPO }}:${{ env.RELEASE_VERSION }}
            ${{ env.IMAGE_REPO }}:latest

      - name: Generate GitHub build attestation
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE_REPO }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Create v0.2.0 GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          cat > /tmp/release-notes.md <<'EOF'
          ## Correctness and reproducibility
          - Replaced fixed-date Ganzhi year/month approximations with a pinned `lunar_python==1.4.8` exact solar-term baseline.
          - Added January cross-year, real `jie` boundary, late-Zi convention, and 3,653-day zero-mismatch calendar regression coverage.
          - Added structural execution of all 4,096 base-hexagram/moving-line-mask combinations.

          ## Integration and maintenance
          - Added an installable Python package surface with `calculate_ganzhi` and `paipan`.
          - Updated Uvicorn and Node 24-compatible GitHub/Docker actions.
          - Release images now include SBOM/provenance metadata plus a GitHub artifact attestation.
          - Updated English/Chinese validation, source, roadmap, changelog, and release documentation.

          Main implementation: #19
          EOF
          gh release view "$RELEASE_VERSION" >/dev/null 2>&1 || \
            gh release create "$RELEASE_VERSION" \
              --title "$RELEASE_VERSION" \
              --notes-file /tmp/release-notes.md \
              --verify-tag
