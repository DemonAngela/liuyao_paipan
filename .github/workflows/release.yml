name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, for example v0.2.0"
        required: true
        type: string

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    steps:
      - name: Validate version
        shell: bash
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $RELEASE_VERSION"
            exit 1
          fi

      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}

      - name: Set image repository
        shell: bash
        run: echo "IMAGE_REPO=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/liuyao-paipan" >> "$GITHUB_ENV"

      - name: 配置 Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: 配置 Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: 安装锁定依赖
        run: python -m pip install --require-hashes -r requirements-dev.lock

      - name: 发布前验收
        shell: bash
        run: |
          python -m ruff check backend tests init_project.py
          python -m compileall -q backend init_project.py
          for file in frontend/js/*.js; do
            node --check "$file"
          done
          python -m pytest

      - name: Create tag for manual release
        if: github.event_name == 'workflow_dispatch'
        run: |
          if git rev-parse "$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "Tag $RELEASE_VERSION already exists"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$RELEASE_VERSION" -m "$RELEASE_VERSION"
            git push origin "$RELEASE_VERSION"
          fi

      - name: 生成源码包与校验和
        shell: bash
        run: |
          mkdir -p dist
          archive_name="liuyao_paipan-${RELEASE_VERSION}.zip"
          archive="dist/${archive_name}"
          git archive \
            --format=zip \
            --prefix="liuyao_paipan-${RELEASE_VERSION}/" \
            --output="$archive" \
            "$RELEASE_VERSION"
          (
            cd dist
            sha256sum "$archive_name" > "${archive_name}.sha256"
          )

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push container
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          sbom: true
          provenance: mode=max
          tags: |
            ${{ env.IMAGE_REPO }}:${{ env.RELEASE_VERSION }}
            ${{ env.IMAGE_REPO }}:latest

      - name: Generate GitHub build attestation
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE_REPO }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          archive="dist/liuyao_paipan-${RELEASE_VERSION}.zip"
          gh release view "$RELEASE_VERSION" >/dev/null 2>&1 || \
            gh release create "$RELEASE_VERSION" \
              "$archive" \
              "${archive}.sha256" \
              --verify-tag \
              --generate-notes \
              --title "$RELEASE_VERSION"
