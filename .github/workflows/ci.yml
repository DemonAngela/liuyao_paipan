name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 配置 Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: 配置 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: 安装锁定依赖
        run: python -m pip install --require-hashes -r requirements-dev.lock

      - name: Python 静态检查
        run: python -m ruff check backend tests init_project.py

      - name: Python 编译检查
        run: python -m compileall -q backend init_project.py

      - name: JavaScript 语法检查
        shell: bash
        run: |
          for file in frontend/js/*.js; do
            node --check "$file"
          done

      - name: 自动化测试
        run: python -m pytest
